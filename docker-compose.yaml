name: auth-api

services:
  # -------------------------------------
  # Redis Service
  # -------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   container_name: auth-api-redis
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - ./.data/redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - local-network

  # -------------------------------------
  # PostgreSQL Service
  # -------------------------------------
  db:
    image: postgres:18.6-alpine
    container_name: auth-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-auth}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ stores data in /var/lib/postgresql/<major>/docker,
      # so the volume must be mounted at /var/lib/postgresql.
      - ./.data/postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-network

networks:
  local-network:
    driver: bridge
